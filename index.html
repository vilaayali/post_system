      .ticket-dock .seg button {
        min-height: 42px;
      }
      .ticket-dock .co-main {
        min-height: 56px;
      }
      .ticket-dock .co-alt {
        min-height: 46px;
      }
      .ticket-dock .btn-void {
        min-height: 40px;
        margin: 0;
        border-width: 1px;
        font-size: 14px;
      }

      /* ---- Order panel, less crowded: one row per dish, a short dock ---- */
      .ticket-head h3 {
        white-space: nowrap;
      }
      .head-tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }
      .slip .ticket-sub {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .cust-line {
        display: flex;
        gap: 6px;
        color: var(--ink);
        line-height: 1.35;
      }
      .cust-line svg {
        flex: none;
        margin-top: 2px;
        color: var(--muted);
      }
      .slip .line {
        grid-template-columns: minmax(0, 1fr) auto 34px;
        align-items: center;
        gap: 2px 8px;
        padding: 9px 0;
      }
      .slip .lines.ro .line {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      .slip .line .ldet,
      .slip .line .ctl {
        grid-column: 1 / -1;
        margin: 0;
      }
      .slip .line .ldet {
        font-size: 13px;
      }
      .ldel {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 9px;
        background: none;
        color: var(--chili-ink);
      }
      .ldel:hover {
        background: var(--chili-soft);
      }
      .slip .line .ctl {
        padding-top: 2px;
      }
      .ticket-scroll .ticket-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ticket-scroll .tool {
        flex: 1 1 auto;
        flex-direction: row;
        gap: 6px;
        min-height: 40px;
        padding: 6px 12px;
        border-radius: 10px;
      }
      .tool-del {
        color: var(--chili-ink);
        border-color: color-mix(in srgb, var(--chili) 40%, transparent);
      }
      .tool-del:hover {
        background: var(--chili-soft);
        border-color: var(--chili);
        color: var(--chili-ink);
      }
      .ticket-dock {
        gap: 8px;
        padding: 10px 14px 12px;
      }
      .dock-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dock-top .dock-total {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        margin-inline-end: auto;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.15;
      }
      .dock-top .dock-total b {
        color: var(--ink);
        font-size: 22px;
        white-space: nowrap;
      }
      .ticket-dock .seg {
        flex: 0 1 220px;
        padding: 3px;
        border-radius: 12px;
      }
      .ticket-dock .seg button {
        min-height: 38px;
        padding: 0 8px;
        font-size: 14px;
        border-radius: 9px;
      }
      .ticket-dock .co-main {
        min-height: 54px;
        font-size: 17px;
      }
      .dock-alts {
        display: flex;
        gap: 8px;
      }
      .sent-fold {
        display: flex;
        align-items: center;
        gap: 8px;
        width: calc(100% - 32px);
        margin: 10px 16px 2px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        text-align: start;
      }
      .sent-fold span {
        margin-inline-end: auto;
      }
      .sent-fold b {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .sent-fold:hover {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      button.cust-line {
        border: 0;
        background: none;
        padding: 2px 0;
        font: inherit;
        text-align: start;
        cursor: pointer;
      }
      button.cust-line:hover span {
        text-decoration: underline;
      }
      .cust-add {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 2px;
        padding: 4px 10px;
        border: 1px dashed var(--line-strong);
        border-radius: 8px;
        background: none;
        color: var(--green-ink);
        font: inherit;
        font-weight: 600;
      }
      /* Dish popup: size tiles, a big quantity, everything else folded */
      .cfg {
        display: grid;
        gap: 14px;
      }
      .sizes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
      }
      .size {
        display: grid;
        gap: 2px;
        padding: 14px 10px;
        border: 2px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
        text-align: center;
      }
      .size b {
        font-size: 17px;
      }
      .size span {
        color: var(--muted);
        font-weight: 600;
      }
      .size.on {
        border-color: var(--green);
        background: var(--green-soft);
      }
      .size.on span {
        color: var(--green-ink);
      }
      .cfg-qty {
        display: flex;
        justify-content: center;
      }
      .stepper.big button {
        width: 52px;
        height: 52px;
        font-size: 24px;
      }
      .stepper.big > span {
        min-width: 56px;
        font-size: 24px;
        font-weight: 800;
        text-align: center;
      }
      .cfg-more {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border: 1px dashed var(--line-strong);
        border-radius: 10px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-weight: 600;
      }
      .cfg-more:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      /* the big total lives in the dock; the slip keeps a quieter one */
      .r-sums .sumrow.total {
        font-size: 20px;
      }
      @media (min-width: 1400px) {
        .order {
          grid-template-columns: minmax(0, 1fr) 440px;
        }
      }
      .dock-alts .co-alt {
        flex: 1 1 0;
        min-width: 0;
        min-height: 44px;
        padding-inline: 8px;
        font-size: 15px;
        border-width: 1px;
      }

      /* ---- Payment: amount, then method tiles, then one button ---- */
      .balance b {
        font-family: var(--body);
        font-size: 32px;
      }
      .step-q {
        display: block;
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .mtiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 8px;
      }
      .mtile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 84px;
        padding: 10px 8px;
        border: 2px solid var(--line-strong);
        border-radius: 14px;
        background: var(--surface);
        color: var(--ink);
        text-align: center;
      }
      .mtile b {
        font-size: 15px;
      }
      .mtile small {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.3;
      }
      .mtile svg {
        color: var(--muted);
      }
      .mtile:hover {
        border-color: var(--green);
      }
      .mtile.on {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green-ink);
      }
      .mtile.on svg {
        color: var(--green-ink);
      }
      .mtile.off {
        opacity: 0.6;
      }
      .pay .prow {
        grid-template-columns: 34px minmax(0, 1fr) 150px 40px;
      }
      .pay .co-main {
        width: 100%;
      }
      .disc-box {
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .disc-box:empty {
        display: none;
      }

      /* ---- Less text: "coming soon" tags and the repeated English/Urdu
         dish names are hidden (render() also hides help sentences). ---- */
      .main .soon-list,
      .main .soon,
      html:not([lang='ur']) .item .ur,
      html:not([lang='ur']) .board-item .urn {
        display: none;
      }
      .main [hidden] {
        display: none !important;
      }
      .sbtn {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
      }
      .sbtn.in {
        color: var(--green-ink);
        border-color: var(--green);
      }

      @media (max-width: 1100px) and (min-width: 761px) {
        :root {
          --side: 184px;
        }
        .rail-btn {
          gap: 10px;
          padding: 8px 10px;
          font-size: 14px;
        }
      }
      @media (max-width: 760px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
        }
        .rail {
          padding: 6px;
        }
        .rail-group {
          display: none;
        }
        .rail-btn {
          flex-direction: column;
          justify-content: center;
          gap: 3px;
          min-width: 72px;
          min-height: 0;
          padding: 6px 4px;
          font-size: 11px;
          text-align: center;
        }
        .rail-btn > span:not(.rail-count):not(.rail-lock) {
          flex: none;
        }
        .rail-count,
        .rail-lock {
          position: absolute;
          top: 3px;
          inset-inline-end: 10px;
        }
        .rail-btn.on::before {
          inset-inline-start: 10px;
          top: -6px;
        }
        .page-head h2 {
          font-size: 24px;
        }
        /* on a phone the page scrolls; the buttons stay at the bottom */
        .ticket {
          overflow: visible;
        }
        .ticket-scroll {
          overflow: visible;
        }
        .ticket-dock {
          position: sticky;
          bottom: 0;
          z-index: 2;
          box-shadow: 0 -8px 20px rgba(27, 34, 48, 0.08);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* =============================================================
         Palette: "deep ocean and mango". A deep teal for the main actions,
         mango for highlights, sky blue for info, coral red for danger,
         on cool sea-glass surfaces. Depth comes from light falling on the
         cards (a top highlight and a soft lift), not from patterns. Token
         names stay as they were (green = main action, indigo = info,
         saffron = attention).
         ============================================================= */
      :root:not([data-theme='dark']) {
        --bg: #eaf0f1;
        --surface: #ffffff;
        --surface-2: #f5f9f9;
        --ink: #0f1f26;
        --muted: #4e636b;
        --faint: #687b83;
        --line: #dbe5e7;
        --line-strong: #c4d1d4;
        --green: #0b7f86;
        --green-hover: #096d73;
        --green-soft: #dcf0ef;
        --green-ink: #07616a;
        --indigo: #3a76cc;
        --indigo-soft: #e2ebfa;
        --indigo-ink: #285aa3;
        --saffron: #f2a33a;
        --saffron-soft: #fdeed6;
        --saffron-ink: #7a4a06;
        --chili: #df4349;
        --chili-soft: #fce3e3;
        --chili-ink: #ad2a30;
        --night: #0b1f27;
        --night-2: #17363f;
        --night-ink: #a9c3c9;
        --accent: #f2a33a;
        --jaali: linear-gradient(transparent, transparent);
        --grad: linear-gradient(135deg, #0a737b 0%, #13a196 100%);
        --glow: 0 8px 22px -6px rgba(11, 127, 134, 0.45);
        --aura-1: rgba(19, 161, 150, 0.3);
        --aura-2: rgba(242, 163, 58, 0.16);
        --page-glow: rgba(19, 161, 150, 0.1);
        --lift:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 1px 2px rgba(15, 31, 38, 0.06),
          0 10px 28px -12px rgba(15, 31, 38, 0.18);
        --ring: 0 0 0 3px rgba(11, 127, 134, 0.32);
        --shadow:
          0 1px 2px rgba(15, 31, 38, 0.06), 0 8px 22px -10px rgba(15, 31, 38, 0.16);
        --shadow-lg: 0 24px 60px -12px rgba(15, 31, 38, 0.3);
        --scrim: rgba(11, 31, 39, 0.5);
      }
      /* Dark: deep sea, never pure black; brighter tints of each colour so
         text and buttons are easy to read without glare. */
      :root[data-theme='dark'] {
        --bg: #061116;
        --surface: #0c1c22;
        --surface-2: #11262d;
        --ink: #e4f0f1;
        --muted: #9db4ba;
        --faint: #73898f;
        --line: #1b333b;
        --line-strong: #29454e;
        --green: #10958d;
        --green-hover: #16a89f;
        --green-soft: rgba(25, 179, 166, 0.16);
        --green-ink: #7fe0d5;
        --indigo: #5a9cf0;
        --indigo-soft: rgba(90, 156, 240, 0.16);
        --indigo-ink: #a9cbf8;
        --saffron: #f5b04d;
        --saffron-soft: rgba(245, 176, 77, 0.14);
        --saffron-ink: #f8cd8a;
        --chili: #f2676b;
        --chili-soft: rgba(242, 103, 107, 0.15);
        --chili-ink: #f7a3a5;
        --night: #040d11;
        --night-2: #12303a;
        --night-ink: #a9c3c9;
        --accent: #f5b04d;
        --jaali: linear-gradient(transparent, transparent);
        --grad: linear-gradient(135deg, #0b7f82 0%, #15a397 100%);
        --glow: 0 8px 26px -6px rgba(25, 179, 166, 0.45);
        --aura-1: rgba(25, 179, 166, 0.22);
        --aura-2: rgba(245, 176, 77, 0.1);
        --page-glow: rgba(25, 179, 166, 0.08);
        --lift:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 1px 2px rgba(0, 0, 0, 0.4),
          0 14px 34px -14px rgba(0, 0, 0, 0.7);
        --ring: 0 0 0 3px rgba(245, 176, 77, 0.45);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, 0.7);
        --scrim: rgba(2, 8, 11, 0.72);
      }
      /* volume: a soft light from the top of the page, and lifted cards */
      .main {
        background-image: radial-gradient(
          1100px 420px at 75% -120px,
          var(--page-glow),
          transparent 70%
        );
      }
      .panel {
        background: linear-gradient(
          180deg,
          var(--surface) 0%,
          var(--surface-2) 100%
        );
        box-shadow: var(--lift);
      }
      .scrim {
        background: var(--scrim);
      }
      /* the brand mark and rail highlights use butter, not the warning yellow */
      .logo small,
      .login-brand .mark span {
        color: var(--accent);
      }
      .rail-btn.on::before {
        background: var(--accent);
      }
      .rail-btn.on svg {
        color: var(--accent);
      }
      .rail-btn:focus-visible {
        box-shadow: 0 0 0 2px var(--accent);
      }
      .rail-count.warn,
      .banner.warn {
        color: #2b1a00;
      }
      /* platform admin: a cooler blue-black so it reads as a different place */
      .app.admin .rail {
        background: #0a1024;
        border-color: #0a1024;
      }
      .app.admin .rail-btn,
      .app.admin .rail-group {
        color: var(--night-ink);
      }
      .app.admin .rail-btn:hover {
        background: rgba(255, 255, 255, 0.07);
      }
      .app.admin .rail-btn.on {
        background: var(--night-2);
      }
      .app.admin .logo,
      .staff-card.admin .pinhint {
        color: var(--accent);
      }
      .banner.imp,
      .kpi.dark,
      .staff-card.admin {
        background: var(--night);
        border-color: var(--night);
        color: #fff;
      }
      .kpi.dark small,
      .kpi.dark .s,
      .staff-card.admin small {
        color: var(--night-ink);
      }
      :root[data-theme='dark'] .kpi.lead {
        background-color: #3a24a8;
        border-color: #3a24a8;
      }
      /* dark mode: cards sit slightly above the page, inputs are clearly fields */
      :root[data-theme='dark'] .input,
      :root[data-theme='dark'] select,
      :root[data-theme='dark'] textarea {
        background: var(--bg);
        border-color: var(--line-strong);
        color: var(--ink);
      }
      :root[data-theme='dark'] .input::placeholder,
      :root[data-theme='dark'] textarea::placeholder {
        color: var(--faint);
      }
      :root[data-theme='dark'] .seg button.on,
      :root[data-theme='dark'] .btn-primary {
        color: #fff;
      }

      /* ---- Neon: the one bold idea. Main actions glow violet to orchid;
         the sidebar and brand panels carry a faint aurora. ---- */
      .btn-primary,
      .seg button.on {
        background: var(--grad);
        border-color: transparent;
        color: #fff;
      }
      .btn-primary {
        box-shadow: var(--glow);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--grad);
        filter: brightness(1.08) saturate(1.05);
      }
      .btn-primary:disabled {
        box-shadow: none;
        filter: grayscale(0.4);
      }
      .kpi.lead,
      :root[data-theme='dark'] .kpi.lead {
        background-image: var(--jaali), var(--grad);
        border-color: transparent;
        box-shadow: var(--glow);
      }
      .kpi.lead small,
      .kpi.lead .s {
        color: #fff;
      }
      .app:not(.admin) .rail,
      .login-brand,
      .wiz-side {
        background-color: var(--night);
        background-image:
          radial-gradient(120% 55% at 0% 0%, var(--aura-1), transparent 60%),
          radial-gradient(
            110% 45% at 100% 100%,
            var(--aura-2),
            transparent 60%
          );
      }
      .login-brand,
      .wiz-side {
        background-image:
          var(--jaali),
          radial-gradient(120% 55% at 0% 0%, var(--aura-1), transparent 60%),
          radial-gradient(
            110% 45% at 100% 100%,
            var(--aura-2),
            transparent 60%
          );
      }
      .rail-btn.on {
        background: rgba(255, 255, 255, 0.07);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .rail-btn.on::before {
        box-shadow: 0 0 6px rgba(212, 176, 106, 0.5);
      }
      .logo {
        color: #fff;
      }
      /* ---- Dashboard: a wide live sales hero with drifting light behind
         it, three toned stat tiles, then plain lists. One chart only. ---- */
      .dash-hero {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr);
        align-items: end;
        gap: 28px;
        padding: 24px 26px 18px;
        margin-bottom: 14px;
        border-radius: 22px;
      }
      .hero-aura {
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }
      .hero-aura i {
        position: absolute;
        border-radius: 50%;
        filter: blur(38px);
        opacity: 0.55;
      }
      .hero-aura i:nth-child(1) {
        width: 46%;
        aspect-ratio: 1;
        left: -8%;
        top: -40%;
        background: #3ee0c8;
      }
      .hero-aura i:nth-child(2) {
        width: 38%;
        aspect-ratio: 1;
        right: 4%;
        bottom: -55%;
        background: #f2a33a;
        opacity: 0.42;
      }
      .hero-aura i:nth-child(3) {
        width: 30%;
        aspect-ratio: 1;
        left: 42%;
        top: -30%;
        background: #4f8fe6;
        opacity: 0.4;
      }
      .hero-txt {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .dash-hero .v {
        font-size: 48px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        margin: 2px 0 4px;
      }
      .dash-acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dash-hero .hero-txt > small {
        font-size: 14px;
        font-weight: 600;
        opacity: 0.9;
      }
      .hero-split {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      }
      .hs-item {
        display: grid;
        gap: 3px;
        min-width: 0;
        padding: 10px 12px;
        color: #fff;
      }
      .hs-item + .hs-item {
        border-inline-start: 1px solid rgba(255, 255, 255, 0.18);
      }
      .hs-item span {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        opacity: 0.85;
        white-space: nowrap;
      }
      .hs-item b {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .dash-hero .curve {
        margin: 0;
        padding: 0;
      }
      .cv-plot {
        position: relative;
        height: 150px;
      }
      .curve svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .cv-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        transform: translate(-50%, -50%);
      }
      .cv-dot::after {
        content: '';
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.7);
        opacity: 0;
      }
      .cv-axis {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
      }
      .dash-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }
      .stat {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px 18px;
        width: 100%;
        font: inherit;
        color: inherit;
        text-align: start;
      }
      button.stat {
        cursor: pointer;
      }
      button.stat:focus-visible {
        outline: 2px solid var(--tone);
        outline-offset: 2px;
      }
      .stat::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 4px;
        background: var(--tone);
      }
      .st-ic {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--tone-soft);
        color: var(--tone-ink);
      }
      .st-ping {
        position: absolute;
        top: -3px;
        right: -3px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--tone);
        border: 2px solid var(--surface);
      }
      .st-body {
        display: grid;
        min-width: 0;
      }
      .st-body small {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .stat .v {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .stat .s {
        color: var(--muted);
        font-size: 13px;
      }
      .dl-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
      }
      .dl-list li {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 12px;
        padding: 10px 8px;
        border-top: 1px solid var(--line);
        border-radius: 12px;
        font-size: 14.5px;
      }
      .dl-list li + li {
        border-top-left-radius: 0;
        border-top-right-radius: 0;
      }
      .dl-list li.click {
        cursor: pointer;
      }
      .dl-list li.click:hover,
      .dl-list li.click:focus-visible {
        background: var(--surface-2);
      }
      .dl-list.attn li {
        grid-template-columns: 34px minmax(0, 1fr) auto;
      }
      .dl-nm small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 400;
      }
      .dl-ic.tone-indigo {
        background: var(--indigo-soft);
        color: var(--indigo-ink);
        box-shadow: none;
      }
      .dl-ic.tone-chili {
        background: var(--chili-soft);
        color: var(--chili-ink);
        box-shadow: none;
      }
      .dl-tag {
        padding: 3px 9px;
        border-radius: 99px;
        background: var(--saffron-soft);
        color: var(--saffron-ink);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .dl-tag.go {
        background: var(--indigo-soft);
        color: var(--indigo-ink);
      }
      .dl-tag.low {
        background: var(--chili-soft);
        color: var(--chili-ink);
      }
      .dl-foot {
        margin: 6px 0 0;
        padding: 10px 8px 2px;
        border-top: 1px dashed var(--line-strong);
        color: var(--muted);
        font-size: 13px;
      }
      .dash-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        align-items: start;
        margin-bottom: 16px;
      }
      .dash-grid > .panel {
        padding-bottom: 10px;
      }
      @media (max-width: 1180px) {
        .dash-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dash-grid > .panel:last-child {
          grid-column: 1 / -1;
        }
      }
      .dl-list li:first-child {
        border-top: 0;
      }
      .dl-list.ranked li {
        grid-template-columns: 30px minmax(0, 1fr) auto;
      }
      .dl-ic,
      .dl-rk {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: var(--surface-2);
        box-shadow: inset 0 0 0 1px var(--line);
        color: var(--green-ink);
      }
      .dl-rk {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        font-weight: 800;
        font-size: 13px;
        color: var(--muted);
      }
      .ranked li:first-child .dl-rk {
        background: var(--grad);
        box-shadow: var(--glow);
        color: #fff;
      }
      .dl-nm {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .dl-list b {
        font-variant-numeric: tabular-nums;
      }
      .dl-list em {
        min-width: 42px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--green-soft);
        color: var(--green-ink);
        font-style: normal;
        font-size: 12.5px;
        font-weight: 700;
        text-align: center;
      }
      .bar-row .tr i {
        background: var(--grad);
      }
      @media (max-width: 760px) {
        .dash-hero {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
          padding: 20px 18px 14px;
        }
        .dash-hero .v {
          font-size: 40px;
        }
        .cv-plot {
          height: 110px;
        }
        .dash-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 10px;
        }
        /* three short tiles side by side instead of a tall stack */
        .dash-stats {
          gap: 8px;
        }
        .stat {
          flex-direction: column;
          gap: 8px;
          padding: 12px;
        }
        .st-ic {
          width: 34px;
          height: 34px;
          border-radius: 11px;
        }
        .st-body small {
          font-size: 12px;
          line-height: 1.25;
        }
        .stat .v {
          font-size: 22px;
        }
        .stat .s {
          display: none;
        }
        .hs-item {
          padding: 9px 10px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        /* always on, slow: the light behind the hero drifts, the curve's
           tip breathes, busy tiles ping */
        .hero-aura i:nth-child(1) {
          animation: aura-a 14s ease-in-out infinite alternate;
        }
        .hero-aura i:nth-child(2) {
          animation: aura-b 18s ease-in-out infinite alternate;
        }
        .hero-aura i:nth-child(3) {
          animation: aura-c 11s ease-in-out infinite alternate;
        }
        .dash-hero::after {
          content: '';
          position: absolute;
          inset: 0;
          z-index: -1;
          background: linear-gradient(
            105deg,
            transparent 35%,
            rgba(255, 255, 255, 0.13) 50%,
            transparent 65%
          );
          transform: translateX(-100%);
          animation: sheen 7s ease-in-out 1.6s infinite;
          pointer-events: none;
        }
        .cv-dot::after {
          animation: ring 2.4s ease-out infinite;
        }
        .st-ping {
          animation: ping-soft 2s ease-in-out infinite;
        }
        .stat,
        .dl-list li {
          transition:
            transform 0.2s,
            box-shadow 0.2s,
            background-color 0.2s;
        }
        .stat:hover {
          transform: translateY(-3px);
          box-shadow:
            var(--lift),
            0 14px 30px -18px var(--tone);
        }
        .stat:hover .st-ic {
          animation: wobble 0.5s ease;
        }
        .dl-list li.click:hover {
          transform: translateX(4px);
        }
        /* once, when the dashboard opens */
        .dash.enter .dash-hero,
        .dash.enter .stat,
        .dash.enter .dash-grid > .panel {
          animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        }
        .dash.enter .stat:nth-child(1) {
          animation-delay: 0.12s;
        }
        .dash.enter .stat:nth-child(2) {
          animation-delay: 0.19s;
        }
        .dash.enter .stat:nth-child(3) {
          animation-delay: 0.26s;
        }
        .dash.enter .dash-grid > .panel:nth-child(1) {
          animation-delay: 0.32s;
        }
        .dash.enter .dash-grid > .panel:nth-child(2) {

          short = +(-after).toFixed(3);
          after = 0;
        }
        D.stock[st][g] = after;
        const m = {
          id: uid('mv'),
          store: st,
          ing: g,
          qty: +(after - before).toFixed(3),
          type,
          reason: reason || '',
          ref: ref || '',
          user: ACTOR || U.user,
          at: now(),
          short,
        };
        D.moves.push(m);
        return m;
      }

      /* ---------- Reporting helpers ---------- */
      function periodDays(st, period) {
        const end = dayOf(st).date,
          n = period === 'today' ? 1 : period === '7' ? 7 : 30,
          s = new Set();
        for (let i = 0; i < n; i++) s.add(addDays(end, -i));
        return s;
      }
      const storePayments = (st) =>
        D.orders.filter((o) => o.store === st).flatMap((o) => o.payments);
      const byMethod = (list) =>
        Object.fromEntries(
          METHODS.map(([k]) => [
            k,
            sum(
              list.filter((p) => p.method === k),
              (p) => p.amount,
            ),
          ]),
        );
      function storeStats(st, period) {
        const days = periodDays(st, period);
        const settled = D.orders.filter(
          (o) =>
            o.store === st &&
            o.state !== 'void' &&
            o.settledDay &&
            days.has(o.settledDay),
        );
        const pays = storePayments(st).filter((p) => days.has(p.day));
        const sales = sum(settled, (o) => o.bill.total);
        const coll = D.credit.filter(
          (c) => c.type === 'payment' && c.store === st && days.has(c.day),
        );
        return {
          sales,
          orders: settled.length,
          avg: settled.length ? Math.round(sales / settled.length) : 0,
          byM: byMethod(pays),
          collections: sum(coll, (c) => c.amount),
          settled,
        };
      }
      function topItems(orders, n = 5) {
        const m = {};
        orders.forEach((o) =>
          liveLines(o).forEach((l) => {
            m[l.name] = (m[l.name] || 0) + l.qty;
          }),
        );
        return Object.entries(m)
          .sort((a, b) => b[1] - a[1])
          .slice(0, n);
      }
      function dayFigures(st, date) {
        const pays = storePayments(st).filter((p) => p.day === date),
          byM = byMethod(pays);
        const coll = D.credit.filter(
            (c) => c.type === 'payment' && c.store === st && c.day === date,
          ),
          collBy = byMethod(coll);
        const settled = D.orders.filter(
          (o) => o.store === st && o.state !== 'void' && o.settledDay === date,
        );
        const rec = D.closes.find(
          (c) => c.store === st && c.date === date && c.status !== 'reopened',
        );
        const opening =
          date === dayOf(st).date ? dayOf(st).opening : rec ? rec.opening : 0;
        const voids = D.voids.filter((v) => v.store === st && v.day === date);
        return {
          byM,
          collBy,
          collections: sum(coll, (c) => c.amount),
          sales: sum(settled, (o) => o.bill.total),
          orders: settled.length,
          discounts: sum(settled, (o) => o.bill.discount),
          voids: voids.length,
          voidValue: sum(voids, (v) => v.amount),
          opening,
          expected: opening + byM.cash + collBy.cash,
        };
      }
      /* =============================================================
   Business rules: every change to D goes through R.*
   Stock policy: ingredients leave stock once, when a ticket is sent to the kitchen.
   Sent lines are never re-sent; voids after sending do not return ingredients
   (the food is already prepared), and this is written on the void record.
   ============================================================= */
      const FULFIL_NAME = {
        served: 'Served',
        collected: 'Collected',
        out: 'Out for delivery',
        delivered: 'Delivered',
      };
      const R = {
        upsertCustomer(name, phone) {
          let c = custByPhone(phone);
          if (c) {
            if (name && (!c.name || c.name === 'Customer')) c.name = name;
            return c;
          }
          c = {
            id: uid('c'),
            name: name || 'Customer',
            phone,
            createdAt: now(),
          };
          D.customers.push(c);
          audit(
            'customer.changed',
            U.store && U.store !== 'all' ? U.store : 'all',
            `New customer ${c.name}, ${showPhone(phone)}`,
            c.id,
          );
          return c;
        },
        saveCustomer(id, name, phone) {
          guard('customers', null);
          name = (name || '').trim();
          phone = normPhone(phone);
          if (!name) fail('Enter the customer name.');
          if (!validPhone(phone))
            fail('Enter a valid phone number, like 0300-1234567.');
          const dup = custByPhone(phone);
          if (dup && dup.id !== id)
            fail('{x} already uses this phone number.', { x: dup.name });
          let c = id && cust(id);
          if (c) Object.assign(c, { name, phone });
          else {
            c = { id: uid('c'), name, phone, createdAt: now() };
            D.customers.push(c);
          }
          audit(
            'customer.changed',
            U.store || 'all',
            `${c.name}, ${showPhone(phone)}`,
            c.id,
          );
          return c;
        },
        createOrder(st, type, info) {
          guard('order', st);
          assertWritable();
          if (store(st).status !== 'active')
            fail('This branch is paused. New orders are stopped.');
          assertOpenDay(st);
          if (!TYPE_NAME[type]) fail('Choose dine-in, takeaway or delivery.');
          if (type === 'delivery' && !feature(st, 'delivery'))
            fail('Delivery is switched off for this store.');
          const name = (info.name || '').trim(),
            phone = normPhone(info.phone),
            address = (info.address || '').trim();
          if (type === 'delivery') {
            if (!name) fail('Enter the customer name.');
            if (!validPhone(phone))
              fail('Enter a valid phone number, like 0300-1234567.');
            if (!address) fail('Enter the delivery address.');
          }
          if (info.phone && !validPhone(phone))
            fail('Enter a valid phone number, like 0300-1234567.');
          let fee = 0;
          if (type === 'delivery') {
            fee = toInt(info.fee);
            if (isNaN(fee))
              fail('Enter a delivery fee of 0 or more, in whole rupees.');
          }
          const customerId =
            info.customerId ||
            (phone ? R.upsertCustomer(name, phone).id : null);
          const o = {
            id: uid('o'),
            no: `${store(st).code}-${++D.seq.order[st]}`,
            store: st,
            day: dayOf(st).date,
            type,
            label:
              type === 'dine' ? (info.label || '').trim().slice(0, 30) : '',
            customerId,
            cust: {
              name: name || (customerId ? cust(customerId).name : ''),
              phone,
              address,
            },
            deliveryFee: fee,
            // 'now' = pay at the counter before the kitchen, 'later' = after serving/delivery
            payWhen: info.payWhen === 'now' ? 'now' : 'later',
            lines: [],
            tickets: [],
            payments: [],
            discount: null,
            bill: null,
            state: 'open',
            fulfil: null,
            token: null,
            createdAt: now(),
            by: ACTOR || U.user,
            kiosk: !!info.kiosk,
          };
          D.orders.push(o);
          audit(
            'order.created',
            st,
            `${o.no}, ${TYPE_NAME[type]}${o.label ? `, ${o.label}` : ''}${o.cust.name ? `, ${o.cust.name}` : ''}${info.kiosk ? ', from kiosk' : ''}`,
            o.no,
          );
          return o;
        },
        lockCheck(o) {
          if (o.state !== 'open') fail('This order is closed.');
          assertOpenDay(o.store);
        },
        setCustomer(o, cid) {
          guard('order', o.store);
          R.lockCheck(o);
          const c = cust(cid);
          o.customerId = c.id;
          o.cust.name = c.name;
          o.cust.phone = c.phone;
        },
        addLine(o, it, vi, addonIdx, spice, note, qty) {
          guard('order', o.store);
          R.lockCheck(o);
          if (o.payments.length)
            fail(
              'Payment has started, so the bill is locked. Start a new order for extra items.',
            );
          if (!availableAt(o.store, it))
            fail('{x} is not available at this store.', { x: it.name });
          if (!(qty >= 1)) fail('Quantity must be 1 or more.');
          const v = it.variants[vi] || null,
            adds = (addonIdx || []).map((i) => it.addons[i]).filter(Boolean);
          const line = {
            id: uid('l'),
            itemId: it.id,
            name: it.name,
            ur: it.ur,
            variant: v ? v.name : '',
            variantId: v ? v.id : '',
            mult: v ? v.mult : 1,
            addons: adds.map((a) => ({
              id: a.id,
              name: a.name,
              price: a.price,
            })),
            spice: spice || '',
            note: (note || '').trim(),
            qty,
            unit: priceAt(o.store, it, vi) + sum(adds, (a) => a.price),
            sent: false,
            voided: false,
            ticketId: null,
          };
          const same = o.lines.find(
            (l) =>
              !l.sent &&
              !l.voided &&
              l.itemId === line.itemId &&
              l.variantId === line.variantId &&
              l.addons.map((a) => a.id).join() ===
                line.addons.map((a) => a.id).join() &&
              l.spice === line.spice &&
              l.note === line.note &&
              l.unit === line.unit,
          );
          if (same) same.qty += qty;
          else o.lines.push(line);
          return line;
        },
        setQty(o, l, q) {
          guard('order', o.store);
          R.lockCheck(o);
          if (l.sent) fail('Sent items cannot be changed. Delete them instead.');
          if (o.payments.length)
            fail('Payment has started, so the bill is locked.');
          if (q <= 0) o.lines = o.lines.filter((x) => x !== l);
          else l.qty = q;
        },
        setNote(o, l, note) {
          guard('order', o.store);
          R.lockCheck(o);
          if (l.sent) fail('Sent items cannot be changed. Delete them instead.');
          l.note = (note || '').trim();
        },
        send(o) {
          guard('order', o.store);
          R.lockCheck(o);
          const lines = unsentLines(o);
          if (!lines.length) fail('Add at least one dish.');
          const st = o.store,
            date = dayOf(st).date;
          if (!o.token) {
            D.seq.token[st] = D.seq.token[st] || {};
            o.token = D.seq.token[st][date] = (D.seq.token[st][date] || 0) + 1;
          }
          const round = o.tickets.length + 1;
          const tk = {
            id: uid('k'),
            no: round === 1 ? String(o.token) : `${o.token}-${round}`,
            at: now(),
            status: 'ready',
            lineIds: lines.map((l) => l.id),
            by: ACTOR || U.user,
            voided: false,
            stockDone: false,
          };
          o.tickets.push(tk);
          lines.forEach((l) => {
            l.sent = true;
            l.ticketId = tk.id;
            l.sentAt = tk.at;
          });
          const shorts = [];
          if (feature(st, 'stock')) {
            const use = {};
            lines.forEach((l) => {
              const it = item(l.itemId);
              if (!it) return;
              it.recipe.forEach(([g, q]) => {
                use[g] = (use[g] || 0) + q * l.mult * l.qty;
              });
              l.addons.forEach((a) => {
                const ao = it.addons.find((x) => x.id === a.id);
                if (ao)
                  ao.recipe.forEach(([g, q]) => {
                    use[g] = (use[g] || 0) + q * l.qty;
                  });
              });
            });
            Object.entries(use).forEach(([g, q]) => {
              const m = moveStock(
                st,
                g,
                -+q.toFixed(3),
                'sale',
                `${o.no}, token ${tk.no}`,
                tk.id,
                true,
              );
              if (m.short)
                shorts.push(`${ingName(g)} ${fmtQty(m.short)} ${ing(g).unit}`);
            });
            tk.stockDone = true;
          }
          audit(
            'order.sent',
            st,
            `${o.no}, token ${tk.no}, ${sum(lines, (l) => l.qty)} items${shorts.length ? `, short: ${shorts.join(', ')}` : ''}`,
            o.no,
          );
          return { tk, shorts };
        },
        fulfil(o, step) {
          guard(
            step === 'served' || step === 'collected' ? 'order' : 'order',
            o.store,
          );
          if (o.state !== 'open') fail('This order is closed.');
          const ks = kState(o);
          if (step === 'served' || step === 'collected') {
            if (o.type === 'delivery')
              fail('Delivery orders go out for delivery instead.');
            if (unsentLines(o).length)
              fail('Some items are not sent to the kitchen yet.');
            if (ks !== 'ready') fail('Send the order to the kitchen first.');
          } else if (step === 'out') {
            if (o.type !== 'delivery')
              fail('Only delivery orders go out for delivery.');
            if (unsentLines(o).length)
              fail('Some items are not sent to the kitchen yet.');
            if (ks !== 'ready') fail('Send the order to the kitchen first.');
            o.outAt = now();
          } else if (step === 'delivered') {
            if (o.fulfil !== 'out')
              fail('Send the order out for delivery first.');
          } else return;
          o.fulfil = step;
          o.fulfilAt = now();
          audit('order.status', o.store, `${o.no}: ${FULFIL_NAME[step]}`, o.no);
          R.refresh(o);
        },
        refresh(o) {
          if (o.state === 'open' && payState(o) === 'paid' && isFulfilled(o)) {
            o.state = 'done';
            o.doneAt = now();
          }
        },
        approver(st, pin) {
          const u = user();
          if (isManagerOf(u, st)) return u;
          if (!pin) return null;
          const a = approverByPin(pin, st);
          if (!a) fail('That PIN does not belong to a manager of this store.');
          return a;
        },
        discount(o, type, value, pin) {
          guard('discount', o.store);
          R.lockCheck(o);
          if (o.payments.length)
            fail('Payment has started, so the bill is locked.');
          if (type === 'none') {
            if (o.discount)
              audit(
                'discount.applied',
                o.store,
                `${o.no}: discount removed`,
                o.no,
              );
            o.discount = null;
            return { ok: true };
          }
          const sub = sum(liveLines(o), (l) => l.unit * l.qty);
          if (!sub) fail('Add at least one dish.');
          const v = toInt(value);
          if (isNaN(v) || v <= 0) fail('Enter a discount above 0.');
          if (type === 'pct' && v > 100)
            fail('A discount cannot be more than 100%.');
          if (type === 'amt' && v > sub)
            fail('The discount cannot be more than the subtotal of {x}.', {
              x: rs(sub),
            });
          const amount = type === 'pct' ? Math.round((sub * v) / 100) : v,
            pct = (amount / sub) * 100,
            u = user();
          let ap = null;
          if (u.role === 'cashier' && pct > CASHIER_DISCOUNT_LIMIT) {
            if (!pin) return { needPin: true, pct };
            ap = approverByPin(pin, o.store);
            if (!ap)
              fail('That PIN does not belong to a manager of this store.');
          }
          o.discount = {
            type,
            value: v,
            amount,
            by: u.id,
            approvedBy: ap ? ap.id : null,
            at: now(),
          };
          audit(
            'discount.applied',
            o.store,
            `${o.no}: ${type === 'pct' ? v + '%' : rs(v)} = ${rs(amount)} by ${u.name}`,
            o.no,
          );
          if (ap)
            audit(
              'discount.approved',
              o.store,
              `${o.no}: ${rs(amount)} (${Math.round(pct)}%) approved by ${ap.name}`,
              o.no,
            );
          return { ok: true };
        },
        voidLine(o, l, reason, pin) {
          guard('void', o.store);
          R.lockCheck(o);
          if (o.payments.length)
            fail('This order has payments. Refunds come in Phase 2.');
          if (!l.sent) {
            o.lines = o.lines.filter((x) => x !== l);
            return { ok: true };
          }
          if (!reason) fail('Choose a reason.');
          const ap = R.approver(o.store, pin);
          if (!ap) return { needPin: true };
          l.voided = true;
          const amount = l.unit * l.qty;
          D.voids.push({
            id: uid('v'),
            store: o.store,
            day: dayOf(o.store).date,
            orderId: o.id,
            orderNo: o.no,
            item: `${l.qty} × ${l.name}${l.variant ? ` (${l.variant})` : ''}`,
            amount,
            reason,
            by: U.user,
            approvedBy: ap.id,
            at: now(),
            stock: 'Ingredients not returned: already prepared',
          });
          const tk = o.tickets.find((k) => k.id === l.ticketId);
          if (
            tk &&
            tk.lineIds.every((id) => {
              const x = o.lines.find((y) => y.id === id);
              return !x || x.voided;
            })
          )
            tk.voided = true;
          audit(
            'item.voided',
            o.store,
            `${o.no}: ${l.qty} × ${l.name}, ${rs(amount)}. ${reason}. Ingredients not returned.`,
            o.no,
          );
          audit(
            'void.approved',
            o.store,
            `${o.no}: approved by ${ap.name}`,
            o.no,
          );
          return { ok: true };
        },
        voidOrder(o, reason, pin) {
          guard('void', o.store);
          R.lockCheck(o);
          if (!reason) fail('Choose a reason.');
          const sent = o.lines.some((l) => l.sent && !l.voided),
            paid = paidOf(o);
          let ap = null;
          // Giving money back or wasting cooked food needs a manager.
          if (sent || paid) {
            ap = R.approver(o.store, pin);
            if (!ap) return { needPin: true };
          }
          const amount = sum(liveLines(o), (l) => l.unit * l.qty);
          // Refund: each payment is reversed in the same method, on today's
          // business day, so cash in the drawer and udhaar balances stay right.
          if (paid) {
            const day = dayOf(o.store).date,
              at = now();
            o.payments.slice().forEach((p) => {
              o.payments.push({
                id: uid('p'),
                method: p.method,
                amount: -p.amount,
                day,
                at,
                by: U.user,
                refund: true,
              });
              if (p.method === 'udhaar')
                D.credit.push({
                  id: uid('cr'),
                  customer: o.customerId,
                  type: 'credit',
                  amount: -p.amount,
                  store: o.store,
                  day,
                  order: o.id,
                  orderNo: o.no,
                  at,
                  by: U.user,
                });
            });
            audit(
              'payment.refunded',
              o.store,
              `${o.no}: ${rs(paid)} given back`,
              o.no,
            );
          }
          o.state = 'void';
          o.voidAt = now();
          o.voidReason = reason;
          o.tickets.forEach((k) => {
            k.voided = true;
          });
          o.lines.forEach((l) => {
            l.voided = true;
          });
          D.voids.push({
            id: uid('v'),
            store: o.store,
            day: dayOf(o.store).date,
            orderId: o.id,
            orderNo: o.no,
            item: 'Whole order',
            amount,
            reason,
            by: U.user,
            approvedBy: ap ? ap.id : null,
            at: now(),
            stock: sent
              ? 'Ingredients not returned: already prepared'
              : 'No ingredients used',
          });
          audit(
            'order.voided',
            o.store,
            `${o.no}: ${reason}, ${rs(amount)}${sent ? ', ingredients not returned' : ''}`,
            o.no,
          );
          if (ap)
            audit(
              'void.approved',
              o.store,
              `${o.no}: approved by ${ap.name}`,
              o.no,
            );
          return { ok: true };
        },
        pay(o, alloc, customerId) {
          guard('pay', o.store);
          R.lockCheck(o);
          if (toInt(alloc.udhaar) > 0 && !planHas('udhaar'))
            fail('Udhaar is not in your plan.');
          if (!liveLines(o).length) fail('Add at least one dish.');
          const due = dueOf(o);
          if (due <= 0) fail('This order is already paid.');
          const amts = {};
          let total = 0;
          for (const [k] of METHODS) {
            const raw = alloc[k];
            if (raw == null || String(raw).trim() === '') continue;
            const n = toInt(raw);
            if (isNaN(n)) fail('Amounts must be whole rupees.');
            if (n > 0) {
              amts[k] = n;
              total += n;
            }
          }
          if (!total) fail('Enter at least one amount.');
          if (amts.udhaar) {
            const cid = customerId || o.customerId;
            if (!cid || !cust(cid))
              fail('Udhaar needs a customer. Add one first.');
            o.customerId = cid;
            if (!o.cust.name) o.cust.name = cust(cid).name;
          }
          let change = 0;
          if (total > due) {
            const extra = total - due;
            if (!amts.cash || amts.cash < extra)
              fail(
                'The amounts are {x} more than the bill. Only extra cash can be given back as change.',
                { x: rs(extra) },
              );
            change = extra;
            amts.cash -= extra;
            if (!amts.cash) delete amts.cash;
          }
          if (!o.bill) o.bill = liveBill(o);
          const day = dayOf(o.store).date,
            at = now(),
            by = ACTOR || U.user;
          Object.entries(amts).forEach(([m, a]) => {
            o.payments.push({
              id: uid('p'),
              method: m,
              amount: a,
              day,
              at,
              by,
            });
            if (m === 'udhaar')
              D.credit.push({
                id: uid('cr'),
                customer: o.customerId,
                type: 'credit',
                amount: a,
                store: o.store,
                day,
                order: o.id,
                orderNo: o.no,
                at,
                by,
              });
          });
          if (change) o.change = (o.change || 0) + change;
          audit(
            'payment.recorded',
            o.store,
            `${o.no}: ${Object.entries(amts)
              .map(([m, a]) => `${methodName(m)} ${rs(a)}`)
              .join(', ')}${change ? `, change ${rs(change)}` : ''}`,
            o.no,
          );
          if (amts.udhaar)
            audit(
              'credit.created',
              o.store,
              `${cust(o.customerId).name}: ${rs(amts.udhaar)} on ${o.no}`,
              o.customerId,
            );
          const paid = payState(o) === 'paid';
          let sent = null;
          if (paid) {
            o.settledDay = day;
            o.settledAt = at;
            if (unsentLines(o).length) sent = R.send(o);
          }
          R.refresh(o);
          return { change, paid, sent };
        },
        collect(cid, amount, st, method) {
          guard('collect', st);
          assertOpenDay(st);
          const c = cust(cid);
          if (!c) fail('Choose a customer.');
          const bal = custBalance(cid),
            a = toInt(amount);
          if (isNaN(a) || a <= 0) fail('Enter an amount above 0.');
          if (a > bal)
            fail('That is more than the {x} outstanding.', { x: rs(bal) });
          if (!METHODS.some((m) => m[0] === method) || method === 'udhaar')
            fail('Choose how the money was received.');
          D.credit.push({
            id: uid('cr'),
            customer: cid,
            type: 'payment',
            amount: a,
            store: st,

        saveStaff(id, data) {
          const me = user(),
            editing = id && userById(id);

          const tn = tenant();
          if (

          if (editing && editing.id === me.id && role !== me.role)

          // Custom access: only the owner sets it. Lists equal to the role's

          let screens = editing ? editing.screens : undefined,

            const okS = ACCESS_SCREENS.map((x) => x[0]).filter(

            const defS = ROLES[role].screens.filter((k) => okS.includes(k)),
              defP = ROLES[role].perms.filter((k) => okP.includes(k));
            const same = sameSet(sc, defS) && sameSet(pm, defP);
            screens = same ? undefined : sc;
            perms = same ? undefined : pm;
          }
          if (
            role === 'owner' ||
            (editing && editing.role !== role && !data.screens)
          )
            screens = perms = undefined;
          let u = editing;

              role,

              active: data.active !== false,

              active: true,
            };
            D.users.push(u);
          }
          if (screens) u.screens = screens;
          else delete u.screens;
          if (perms) u.perms = perms;
          else delete u.perms;
          audit(
            'staff.changed',
            stores === 'all' || !stores.length ? 'all' : stores[0],
            `${name}: ${ROLES[role].label}, ${stores === 'all' ? 'all stores' : [...stores.map((s) => store(s).name), ...regions.map((r) => `${regionName(r)} region`)].join(', ')}${hasCustomAccess(u) ? `, custom access: ${userScreens(u).length} screens, ${userPerms(u).length} actions` : ''}${editing ? '' : ' (new)'}`,
            u.id,

        /* ---------- Branches (data-driven, any number) ----------
     Server: POST /branches checks canAddBranch with ACTIVE branches only and
     returns 403 { code: 'PLAN_LIMIT', limit, suggestedPlan } when full. */
        createBranch(data) {
          guard('business', 'all');
          assertWritable();
          const tn = tenant();
          if (!canAddBranch(tn, activeBranchCount(tn))) {
            const e = new RuleError(
              t(
                'Your {p} plan allows {n} active branches. Upgrade to add more.',
                {
                  p: planOf(tn).name,
                  n: limitOf(tn, 'maxBranches'),
                },
              ),
            );
            e.code = 'PLAN_LIMIT';
            e.suggestedPlan = (
              planForBranches(activeBranchCount(tn) + 1) || {}
            ).id;
            throw e;
          }
          const name = (data.name || '').trim(),
            city = (data.city || '').trim(),
            address = (data.address || '').trim(),
            phone = (data.phone || '').trim();
          if (name.length < 2) fail('Enter the branch name.');
          if (D.stores.some((s) => s.name.toLowerCase() === name.toLowerCase()))
            fail('A branch with this name already exists.');
          if (!city) fail('Choose a city.');
          if (!address) fail('Enter the branch address.');
          const svc =
              data.servicePct === '' || data.servicePct == null
                ? D.business.servicePct
                : toNum(data.servicePct),
            tax =
              data.taxPct === '' || data.taxPct == null
                ? D.business.taxPct
                : toNum(data.taxPct);
          if (isNaN(svc) || svc < 0 || svc > 30)
            fail('Service charge must be between 0 and 30%.');
          if (isNaN(tax) || tax < 0 || tax > 30)
            fail('Tax must be between 0 and 30%.');
          // Branch code: first letters of the name, made unique.
          let code = name
            .replace(/[^A-Za-z ]/g, '')
            .split(/\s+/)
            .filter(Boolean)
            .map((w) => w[0])
            .join('')
            .toUpperCase()
            .slice(0, 3);
          if (code.length < 2)
            code =
              name
                .replace(/[^A-Za-z]/g, '')
                .slice(0, 3)
                .toUpperCase() || 'BR';
          let c = code,
            k = 2;
          while (D.stores.some((s) => s.code === c)) c = `${code}${k++}`;
          const id = uid('br');
          const s = {
            id,
            tenantId: tn.id,
            code: c,
            name,
            ur: name,
            city,
            address,
            phone,
            regionId: data.regionId || null,
            status: 'active',
            managerId: data.managerId || null,
            createdAt: now(),
            archivedAt: null,
          };
          D.stores.push(s);
          D.settings[id] = newSettings(s, { servicePct: svc, taxPct: tax });
          // Overrides are stored as differences from the master menu only.
          D.overrides[id] = {};
          if (
            data.menu === 'copy' &&
            data.copyFrom &&
            D.overrides[data.copyFrom]
          )
            D.overrides[id] = JSON.parse(
              JSON.stringify(D.overrides[data.copyFrom]),
            );
          if (data.menu === 'empty')
            D.items.forEach(
              (it) => (D.overrides[id][it.id] = { available: false }),
            );
          D.stock[id] = {};
          D.low[id] = {};
          if (data.stock !== 'empty')
            D.ingredients.forEach((g) => {
              D.stock[id][g.id] = 0;
              const src = data.copyFrom && D.low[data.copyFrom];
              D.low[id][g.id] = src && src[g.id] != null ? src[g.id] : 0;
            });
          D.seq.order[id] = D.stores.length * 1000;
          D.days[id] = {
            date: ymd(now()),
            status: 'open',
            opening: 0,
            openedAt: now(),
            openedBy: ACTOR || U.user,
          };
          // Staff access (staffBranches many-to-many) and the manager.
          const access = new Set(data.staff || []);
          if (data.managerId) access.add(data.managerId);
          access.forEach((uid2) => {
            const u = userById(uid2);
            if (u && u.stores !== 'all' && !u.stores.includes(id))
              u.stores.push(id);
          });
          audit(
            'branch.created',
            id,
            `${name}, ${city}${data.menu === 'copy' && data.copyFrom ? `, menu copied from ${store(data.copyFrom).name}` : data.menu === 'empty' ? ', empty menu' : ', master menu'}`,
            id,
          );
          return s;
        },
        updateBranch(id, data) {

        // What stops a branch from being archived. Open orders and an unclosed day

        archiveChecks(id) {
          const open = D.orders.filter(
            (o) => o.store === id && o.state === 'open',

          const left = D.ingredients.filter((g) => stockQty(id, g.id) > 0);
          return {
            open: open.length,

      function as(id, fn) {
        const pu = U.user,
          pa = ACTOR;

        ACTOR = id;
        try {
          return fn();
        } finally {
          U.user = pu;

      const CASHIER = { gul: 'u4', dha: 'u7', jt: 'u8' },
        MANAGER = { gul: 'u3', dha: 'u2', jt: 'u8' };
      const OPENING = { gul: 10000, dha: 8000, jt: 6000 };
      function allocFor(o, mix) {
        const due = dueOf(o),
          out = {};
        let fixed = 0;
        Object.entries(mix).forEach(([m, v]) => {
          if (v !== 'rest') {
            out[m] = Math.min(v, due - fixed);
            fixed += out[m];
          }
        });
        Object.entries(mix).forEach(([m, v]) => {
          if (v === 'rest') out[m] = due - fixed;
        });
        return out;
      }
      function seedFlow(st, at, s) {
        const cashier = s.by || CASHIER[st],
          c = s.cust ? cust(s.cust) : null;
        CLOCK = at;
        const o = as(cashier, () =>
          R.createOrder(st, s.type, {
            label: s.label || '',
            name: c ? c.name : s.name || '',
            phone: c ? c.phone : '',
            address: s.address || '',
            fee: s.fee != null ? s.fee : 0,
            customerId: c ? c.id : null,
          }),
        );
        s.lines.forEach((L) =>
          as(cashier, () =>
            R.addLine(
              o,
              item(L[0]),
              L[1] || 0,
              L[3] || [],
              L[4] || '',
              L[5] || '',
              L[2] || 1,
            ),
          ),
        );
        if (s.disc)
          as(cashier, () => R.discount(o, s.disc[0], s.disc[1], s.disc[2]));
        if (s.prepay) {
          CLOCK = at + MIN;
          as(cashier, () => R.pay(o, allocFor(o, s.prepay), null));
        } else if (s.send !== false) {
          CLOCK = at + 2 * MIN;
          as(cashier, () => R.send(o));
        }
        if (s.voidLine != null) {
          CLOCK = at + 5 * MIN;
          as(cashier, () =>
            R.voidLine(
              o,
              o.lines[s.voidLine],
              s.voidReason || 'Long wait',
              s.voidPin,
            ),
          );
        }
        // minutes the kitchen takes before the order is served or sent out
        const cookMin = s.cookMin || 16;
        if (s.out || (s.done && o.type === 'delivery')) {
          CLOCK = at + (cookMin + 2) * MIN;
          as(cashier, () => R.fulfil(o, 'out'));
        }
        if (s.pay && !s.prepay) {
          CLOCK = at + (cookMin + 20) * MIN;
          as(cashier, () => R.pay(o, allocFor(o, s.pay), null));
        }
        if (s.done) {
          CLOCK = at + (cookMin + 22) * MIN;
          as(cashier, () =>
            R.fulfil(
              o,
              o.type === 'dine'
                ? 'served'
                : o.type === 'take'
                  ? 'collected'
                  : 'delivered',
            ),
          );
        }
        return o;
      }

              status,

                status === 'trial'
                  ? T + 5 * DAYMS
                  : T - (daysOld - TRIAL_DAYS) * DAYMS,
              limitOverrides: { maxBranches: null, maxUsers: null },
              createdAt: T - daysOld * DAYMS,
              nextBillingAt:
                status === 'trial'
                  ? T + 5 * DAYMS
                  : T + (((daysOld * 7) % 26) + 3) * DAYMS,
              notes:
                id === 'brn'
                  ? [
                      {
                        at: T - 3 * DAYMS,
                        text: 'Called Javed sahib about the October invoice. Promised to pay by Friday.',
                        by: 'pa1',
                      },
                    ]
                  : id === 'ptp'
                    ? [
                        {
                          at: T - 9 * DAYMS,
                          text: 'Suspended after two unpaid invoices and three reminders.',
                          by: 'pa1',
                        },
                      ]
                    : [],

          buildTenant(spec, 7001 + i * 31),
        );

        P().tenants.forEach((tn) => {
          if (tn.status === 'trial') return;
          const start = tn.trialEndsAt;
          const months = [];
          for (let at = start; at < T; at += 30 * DAYMS) months.push(at);
          months.slice(-4).forEach((at, i, a) => {
            const last = i === a.length - 1,
              prev = i === a.length - 2;
            let st = 'paid';
            if (tn.status === 'overdue' && last) st = 'overdue';
            if (tn.status === 'suspended' && (last || prev)) st = 'overdue';
            if (tn.status === 'active' && last && tn.id === 'kbh') st = 'due';

            low: (s) => s.low,

      // Running total of today's sales, hour by hour, drawn as a soft area.
      function salesCurve(settled) {
        const hr = (ts) => new Date(ts).getHours();
        const nowH = hr(Date.now()),
          first = settled.length
            ? Math.min(...settled.map((o) => hr(o.settledAt || o.createdAt)))
            : nowH;
        const from = Math.max(0, Math.min(first - 1, nowH - 5)),
          span = Math.max(1, nowH + 1 - from);
        let run = 0;
        const pts = [];
        for (let i = 0; i <= span; i++) {
          if (i)
            run += sum(
              settled.filter(
                (o) => hr(o.settledAt || o.createdAt) === from + i - 1,
              ),
              (o) => o.bill.total,
            );
          pts.push(run);
        }
        const max = Math.max(1, run),
          W = 300,
          H = 80;
        const xy = pts.map((v, i) => [
          (i / span) * W,
          H - 6 - (v / max) * (H - 14),
        ]);
        // smooth the line with simple midpoint curves
        let d = `M${xy[0][0]},${xy[0][1]}`;
        for (let i = 1; i < xy.length; i++) {
          const [x0, y0] = xy[i - 1],
            [x1, y1] = xy[i],
            mx = (x0 + x1) / 2;
          d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
        }
        const last = xy[xy.length - 1];
        const lbl = (h) =>
          `${((h + 11) % 12) + 1}${h < 12 ? 'am' : 'pm'}`;
        return `<div class="curve"><div class="cv-plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="cv-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path class="cv-area" d="${d} L${W},${H} L0,${H} Z" fill="url(#cv-fill)"/><path class="cv-line" d="${d}" fill="none" stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg><span class="cv-dot" style="left:${(last[0] / W) * 100}%;top:${(last[1] / H) * 100}%"></span></div><div class="cv-axis"><span>${lbl(from)}</span><span>${t('Now')}</span></div></div>`;
      }
      // Payment methods as a plain list, biggest first, with its share.
      function payList(byM) {
        const rows = METHODS.filter(([k]) => byM[k])
            .map(([k, l]) => ({ k, l: t(l), v: byM[k] }))
            .sort((a, b) => b.v - a.v),
          tot = sum(rows, (r) => r.v);
        return `<ul class="dl-list">${rows.map((r) => `<li><span class="dl-ic">${ic(METHOD_IC[r.k] || 'cash', 18)}</span><span class="dl-nm">${r.l}</span><b data-count="${r.v}" data-rs="1">${rs(r.v)}</b><em>${Math.round((r.v / tot) * 100)}%</em></li>`).join('')}</ul>`;
      }
      // Best sellers, ranked. The leader gets the brand colour.
      function rankList(rows) {
        return `<ol class="dl-list ranked">${rows.map(([n, q], i) => `<li><span class="dl-rk">${i + 1}</span><span class="dl-nm">${n}</span><b>×${q}</b></li>`).join('')}</ol>`;
      }
      // The dashboard's one entrance: cards rise in, numbers count up, the
      // curve draws. Only when the screen is opened, never on the live
      // refreshes after that.
      function playIntro() {
        const pg = $('#main .dash');
        if (!pg || matchMedia('(prefers-reduced-motion: reduce)').matches)
          return;
        pg.classList.add('enter');
        $$('[data-count]', pg).forEach((el) => {
          const end = +el.dataset.count,
            money = el.dataset.rs,
            t0 = performance.now();
          if (!end) return;
          const step = (tn) => {
            const k = Math.min(1, (tn - t0) / 900),
              v = Math.round(end * (1 - Math.pow(1 - k, 3)));
            el.textContent = money ? rs(v) : v;
            if (k < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        });
      }

${stat('saffron', 'close', t('Day close'), t(dayOpen ? 'Open' : 'Closed'), dayOpen ? `${t('Opening cash')} ${rs(d.opening)}` : t('Closed at {x}', { x: fmtTime(d.closedAt) }), 'cash')}

      /* =============================================================

${D.ingredients
  .map((g) => {

  })
  .join('')}
</tbody></table></div><p class="hint" style="padding:10px 18px">${t('Stock value')}: <b>${rs(sum(D.ingredients, (g) => stockQty(st, g.id) * g.cost))}</b></p></div>
<div class="panel" style="margin-top:16px"><div class="panel-head"><h3>${t('Recent movements')}</h3><span class="hint">${t('Newest first')}</span></div>
<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('Time')}</th><th>${t('Ingredient')}</th><th class="r">${t('Change')}</th><th>${t('Type')}</th><th>${t('Reason')}</th><th>${t('User')}</th></tr></thead><tbody>${moves.map((m) => `<tr><td class="hint">${fmtDT(m.at)}</td><td>${esc(ingName(m.ing))}</td><td class="r" style="font-weight:600;color:${m.qty < 0 ? 'var(--chili-ink)' : 'var(--green-ink)'}">${m.qty > 0 ? '+' : '−'}${fmtQty(Math.abs(m.qty))} ${ing(m.ing).unit}</td><td>${t(MOVE_NAME[m.type] || m.type)}${m.short ? ` <span class="badge b-chili">${t('short')} ${fmtQty(m.short)}</span>` : ''}</td><td>${esc(m.reason)}</td><td class="hint">${esc(uname(m.user))}</td></tr>`).join('') || `<tr><td colspan="6">${emptyBox(t('No movements yet'), '')}</td></tr>`}</tbody></table></div></div>

<div class="panel"><div class="table-wrap"><table class="tbl"><thead><tr><th>${t('Transfer')}</th><th>${t('Route')}</th><th>${t('Ingredient')}</th><th>${t('Status')}</th><th>${t('Notes')}</th><th></th></tr></thead><tbody>
${
  list
    .map((x) => {
      const [bc, bl] = TR_BADGE[x.status];

        isTo = can('stock', x.to);
      return `<tr><td><b>${esc(x.no)}</b><div class="hint">${fmtDT(x.at)}, ${esc(uname(x.createdBy).split(' ')[0])}</div></td><td>${esc(t(store(x.from).name))} ${ic('arrows', 14)} ${esc(t(store(x.to).name))}</td><td>${fmtQty(x.qty)} ${ing(x.ing).unit} ${esc(ingName(x.ing))}</td><td><span class="badge ${bc}">${t(bl)}</span>${x.receivedAt ? `<div class="hint">${fmtDT(x.receivedAt)}</div>` : ''}</td><td class="hint">${esc(x.notes)}</td>
    <td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end">${x.status === 'draft' && isFrom ? `<button class="btn btn-primary btn-xs" data-act="tr-dispatch" data-id="${x.id}">${t('Dispatch')}</button>` : ''}${x.status === 'in_transit' && isTo ? `<button class="btn btn-primary btn-xs" data-act="tr-receive" data-id="${x.id}">${t('Receive')}</button>` : ''}${['draft', 'in_transit'].includes(x.status) && isFrom ? `<button class="btn btn-quiet btn-xs" data-act="tr-cancel" data-id="${x.id}">${t('Cancel')}</button>` : ''}</div></td></tr>`;
    })
    .join('') ||
  `<tr><td colspan="6">${emptyBox(t('No transfers yet'), '')}</td></tr>`
}
</tbody></table></div></div>`;
        } else {
          const list = D.wastage
            .filter((w) => w.store === st)
            .slice()
            .reverse();
          body = `<div class="grid g2" style="align-items:start">${
            can('stock')
              ? `<div class="panel panel-pad"><h3 style="font-family:var(--display);font-size:22px;margin-bottom:10px">${t('Record wastage')}</h3>
<div class="field"><label for="w-ing">${t('Ingredient')}</label>${selectBox(
                  'w-ing',
                  D.ingredients.map((g) => [
                    g.id,
                    `${g.name} (${fmtQty(stockQty(st, g.id))} ${g.unit} ${t('on hand')})`,
                  ]),
                  'milk',
                )}</div>
${field('w-qty', t('Quantity'), '', { attrs: 'inputmode="decimal" placeholder="0"' })}
<div class="field"><label for="w-reason">${t('Reason')}</label>${selectBox(
                  'w-reason',
                  WASTE_REASONS.map((r) => [r, t(r)]),

                )}</div>
${field('w-notes', t('Notes'), '', { optional: true, attrs: 'maxlength="80"' })}
<p class="hint" style="margin-bottom:10px">${t('Date and time')}: ${fmtDT(Date.now())}</p>
<button class="btn btn-danger" data-act="waste-save">${t('Record wastage')}</button></div>`
              : ''
          }
<div class="panel"><div class="panel-head"><h3>${t('Wastage log')}</h3><span class="hint">${rs(sum(list, (w) => w.value))}</span></div><div class="table-wrap"><table class="tbl"><tbody>${list.map((w) => `<tr><td><b>${fmtQty(w.qty)} ${ing(w.ing).unit} ${esc(ingName(w.ing))}</b><div class="hint">${fmtDT(w.at)}, ${esc(uname(w.user))}</div></td><td>${t(w.reason)}${w.notes ? `<div class="hint">${esc(w.notes)}</div>` : ''}</td><td class="r">${rs(w.value)}</td></tr>`).join('') || `<tr><td>${emptyBox(t('No wastage recorded'), '')}</td></tr>`}</tbody></table></div></div></div>`;

      /* =============================================================

      function closeRows(f) {
        const r = (k, v, b) =>
          `<tr><td>${k}</td><td class="r">${b ? `<b>${v}</b>` : v}</td></tr>`;
        return (
          r(t('Opening cash'), rs(f.opening)) +
          r(t('Cash sales'), rs(f.byM.cash)) +
          r(t('Card machine'), rs(f.byM.card)) +
          r(t('JazzCash'), rs(f.byM.jazzcash)) +
          r(t('Easypaisa'), rs(f.byM.easypaisa)) +
          r(t('Raast QR'), rs(f.byM.raast)) +
          r(t('Udhaar recorded'), rs(f.byM.udhaar)) +
          r(
            `${t('Udhaar collected')} <span class="hint">(${t('not a sale')}, ${t('cash')} ${rs(f.collBy.cash)})</span>`,
            rs(f.collections),
          ) +
          r(t('Expected cash'), rs(f.expected), true) +
          r(t('Total sales'), rs(f.sales), true) +
          r(t('Orders'), f.orders) +
          r(t('Discounts'), rs(f.discounts)) +
          r(t('Deleted orders'), `${f.voids} (${rs(f.voidValue)})`)
        );
      }
      function closeView() {

        const tabs = both
          ? `<div class="tabs" role="tablist">${U.store !== 'all' ? `<button role="tab" class="${U.closeTab === 'store' ? 'on' : ''}" data-act="close-tab" data-v="store">${esc(t(store(U.store).name))}</button>` : ''}<button role="tab" class="${U.closeTab === 'all' ? 'on' : ''}" data-act="close-tab" data-v="all">${t('Consolidated close')}</button></div>`

        if (U.store === 'all') return storePicker('Day close');
        const st = U.store,
          d = dayOf(st),
          f = dayFigures(st, d.date);
        const rec = D.closes
          .filter(
            (c) => c.store === st && c.date === d.date && c.status === 'closed',

          .pop();
        const openUnpaid = D.orders.filter(
          (o) => o.store === st && o.state === 'open' && payState(o) !== 'paid',
        );
        const counted = U.counted != null ? U.counted : '',
          cn = toInt(counted),
          diff = isNaN(cn) ? null : cn - f.expected;

          .filter((c) => c.store === st)
          .slice(-8)
          .reverse();
        const right =
          d.status === 'open'
            ? `<div class="panel panel-pad">${openUnpaid.length ? `<div class="notice warn" style="margin-bottom:12px">${t('{n} unpaid orders stay open and can be paid after you start the next business day.', { n: openUnpaid.length })}</div>` : ''}

  <p class="hint" id="dc-note" style="margin:8px 0 14px">${diff == null ? t('Counted cash − expected cash. Card, wallets and udhaar are not physical cash.') : diff === 0 ? t('The drawer matches.') : diff > 0 ? t('More cash than expected (overage).') : t('Cash is short. Recount before closing.')}</p>
  <button class="btn btn-primary btn-lg btn-block" data-act="close-day" ${can('close') ? '' : 'disabled'}>${ic('lock', 20)} ${t('Close day')}</button></div>`
            : `<div class="panel panel-pad"><div class="notice ok" style="margin-bottom:12px"><b>${t('Closed')}</b>: ${dayLabel(d.date)}${rec ? `, ${fmtTime(rec.at)} ${t('by')} ${esc(uname(rec.by))}` : ''}</div>
  ${rec ? `<div class="sumrow"><span>${t('Expected cash')}</span><b>${rs(rec.expected)}</b></div><div class="sumrow"><span>${t('Counted cash')}</span><b>${rs(rec.counted)}</b></div><div class="sumrow" style="margin-bottom:12px"><span>${t('Cash difference')}</span><b style="color:${rec.diff ? 'var(--chili-ink)' : 'var(--green-ink)'}">${rec.diff > 0 ? '+' : rec.diff < 0 ? '−' : ''}${rs(Math.abs(rec.diff))}</b></div>` : ''}

    can('close')

  <button class="btn btn-quiet btn-block" style="margin-top:6px" data-act="reopen-day">${t('Reopen this day')}</button>`
      : ''
  }</div>`;
        return `<div class="page">${pageHead(`${t('Day close')}: ${esc(t(store(st).name))}`, `${t('Business day')} ${dayLabel(d.date)}. ${t('Closing staff')}: ${esc(user().name)}.`, '', 'dayclose')}${tabs}

        Object.entries(keep).forEach(([id, v]) => {
          const el = document.getElementById(id);
          if (el && M.keepInputs !== false) el.value = v;
        });
        requestAnimationFrame(() => {

            r.querySelector('[autofocus]') ||

          document.head.appendChild(ps);
