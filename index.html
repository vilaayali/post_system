        ps.textContent = `@media print{@page{size:${w}mm auto;margin:${m}mm}#print-area .receipt{max-width:${w - 2 * m}mm;font-size:${w === 58 ? 10.5 : 12}px}${w === 58 ? '#print-area .rtoken b{font-size:38px}#print-area .rh b{font-size:15px}' : ''}}`;
        $('#print-area').innerHTML = html;

          window.print();

          const ids = U.beStaff
            ? [...U.beStaff]
            : D.users
                .filter((u) => u.role !== 'owner' && userStores(u).includes(s))
                .map((u) => u.id);
          if (run(() => R.setBranchStaff(s, ids)).ok) {
            U.beStaff = null;
            render();
            toast(t('Staff access saved.'));
          }
        },
        'branch-settings': (el) => {
          if (setStore(el.dataset.v, 'settings')) render();
        },
        'branch-pause': (el) => {
          const s = store(el.dataset.v);
          confirmModal(
            t('Pause {b}', { b: s.name }),
            t(
              'New orders stop at this branch. Open orders can still be finished and paid. A paused branch is not billed.',
            ),
            t('Pause branch'),
            () => R.pauseBranch(s.id),
          );
        },
        'branch-resume': (el) => {
          let limitHit = false;
          const r = run(() => {
            try {
              return R.resumeBranch(el.dataset.v);
            } catch (e) {
              if (e.code === 'PLAN_LIMIT') limitHit = true;
              throw e;
            }
          });
          if (r.ok) {
            render();
            toast(t('{b} is active again.', { b: store(el.dataset.v).name }));
          } else if (limitHit) upgradeModal('branches');
        },
        'branch-archive': (el) => archiveModal(el.dataset.v),
        'arch-go': (el) => {
          const id = M.id;
          closeModal();
          if (setStore(id, el.dataset.v)) {
            U.closeTab = 'store';
            render();
          }
        },
        'arch-transfer': () => {
          const id = M.id;
          closeModal();
          if (setStore(id, 'stock')) {
            U.stockTab = 'transfers';
            render();
            transferModal();
          }
        },
        'arch-ok': () => {
          const id = M.id,
            name = store(id).name;
          if (run(() => R.archiveBranch(id)).ok) {
            closeModal();
            if (U.screen === 'branch-edit') U.screen = 'branches';
            render();
            toast(
              t('{b} is archived. It no longer counts toward your bill.', {
                b: name,
              }),
            );
          }
        },
        'branch-delete': (el) => {
          const s = store(el.dataset.v);
          confirmModal(
            t('Delete {b}', { b: s.name }),
            t(
              'This branch has no orders, so it can be deleted completely. This cannot be undone.',
            ),
            t('Delete branch'),
            () => R.deleteBranch(s.id),
            true,
          );
        },
        'br-status': (el) => {
          U.branchStatus = el.dataset.v;
          render();
        },
        'br-archived': () => {
          U.showArchived = !U.showArchived;
          render();
        },
        'regions-edit': () => regionsModal(),
        'rg-add': () => {
          $$('#modal-root [id^="rg-"]').forEach(
            (el, i) => M.rows[i] && (M.rows[i].name = el.value),
          );
          M.rows.push({ id: uid('rg'), name: '' });
          renderModal();
        },
        'rg-del': (el) => {
          $$('#modal-root [id^="rg-"]').forEach(
            (e2, i) => M.rows[i] && (M.rows[i].name = e2.value),
          );
          const r0 = M.rows[+el.dataset.v];
          if (
            D.stores.some(
              (s) => s.regionId === r0.id && s.status !== 'archived',
            )
          ) {
            M.err = t('Move this region’s branches to another region first.');
            return renderModal();
          }
          M.rows.splice(+el.dataset.v, 1);
          M.keepInputs = false;
          renderModal();
          M.keepInputs = true;
        },
        'rg-save': () => {
          const rows = M.rows
            .map((r, i) => ({ id: r.id, name: (val(`rg-${i}`) || '').trim() }))
            .filter((r) => r.name);
          if (run(() => R.saveRegions(rows)).ok) {
            closeModal();
            render();
            toast(t('Regions saved.'));
          }
        },
        'as-sort': (el) => {
          const k = el.dataset.v;
          if (U.as.sort === k) U.as.dir *= -1;
          else {
            U.as.sort = k;
            U.as.dir = k === 'name' ? 1 : -1;
          }
          render();
        },
        'as-page': (el) => {
          U.as.page = Math.max(0, U.as.page + +el.dataset.v);
          render();
        },
        // Business settings
        'bz-lang': (el) => {
          U.bzLang = el.dataset.v;
          render();
        },
        'logo-clear': () => {
          U.logoDraft = '';
          render();
        },
        'biz-save': () => {
          const r = run(() => {
            const name = val('bz-name').trim(),
              svc = toNum(val('bz-svc') || '0'),
              tax = toNum(val('bz-tax') || '0');
            if (name.length < 2) fail('Enter the business name.');
            if (isNaN(svc) || svc < 0 || svc > 30)
              fail('Service charge must be between 0 and 30%.');
            if (isNaN(tax) || tax < 0 || tax > 30)
              fail('Tax must be between 0 and 30%.');
            return R.saveBusiness({
              name,
              logo: U.logoDraft != null ? U.logoDraft : D.business.logo,
              footer: val('bz-footer').trim(),
              lang: U.bzLang || D.business.lang,
              servicePct: svc,
              taxPct: tax,
            });
          });
          if (r.ok) {
            U.logoDraft = null;
            U.bzLang = null;
            render();
            toast(
              r.v.length
                ? t('Business settings saved.')
                : t('Nothing changed.'),
            );
          }
        },
        // Platform admin
        'admin-go': (el) => {
          U.adminScreen = el.dataset.v;
          render();
        },
        'tenant-open': (el) => {
          U.adminTenant = el.dataset.v;
          U.adminScreen = 'detail';
          render();
          const m = $('#main');
          if (m) m.scrollTop = 0;
        },
        'tenant-new': () => tenantNewModal(),
        'tn-save': () => {
          const r = run(() =>
            PL.createTenant({
              name: val('tn-name'),
              ownerName: val('tn-owner'),
              phone: val('tn-phone'),
              email: val('tn-email'),
              city: val('tn-city'),
              planId: val('tn-plan'),
              pin: val('tn-pin'),
              status: 'trial',
              createdBy: 'admin',
            }),
          );
          if (r.ok) {
            closeModal();
            U.adminTenant = r.v.id;
            U.adminScreen = 'detail';
            render();
            toast(
              t('{b} created. Owner PIN {p}.', {
                b: r.v.name,
                p: dataOf(r.v).users[0].pin,
              }),
              '',
              t('Business created'),
            );
          }
        },
        'ad-save': () => {
          const id = U.adminTenant;
          if (
            run(() => {
              if (val('ad-name').trim().length < 2)
                fail('Enter the business name.');
              if (!validPhone(normPhone(val('ad-phone'))))
                fail('Enter a valid phone number, like 0300-1234567.');
              PL.updateTenant(id, {
                name: val('ad-name'),
                ownerName: val('ad-owner'),
                phone: normPhone(val('ad-phone')),
                email: val('ad-email'),
                city: val('ad-city'),
              });
            }).ok
          ) {
            render();
            toast(t('Saved.'));
          }
        },
        'ad-plan': () => {
          const id = U.adminTenant,
            p = val('ad-plan');
          if (run(() => PL.changePlan(id, p)).ok) {
            render();
            toast(t('Plan changed to {p}.', { p: planById(p).name }));
          }
        },
        'ad-limits': () => {
          if (
            run(() =>
              PL.setLimits(
                U.adminTenant,
                val('ad-maxb').trim(),
                val('ad-maxu').trim(),
              ),
            ).ok
          ) {
            render();
            toast(t('Custom limits saved.'));
          }
        },
        'ad-status': (el) => {
          if (run(() => PL.setStatus(U.adminTenant, el.dataset.v)).ok) {
            render();
            toast(
              t('Status changed to {s}.', {
                s: t(TENANT_STATUS[el.dataset.v][1]),
              }),
            );
          }
        },
        'ad-note': () => {
          if (run(() => PL.addNote(U.adminTenant, val('ad-note'))).ok) render();
        },
        'admin-view-as': (el) => {
          const id = el.dataset.v;
          useTenant(id);
          const owner = D.users.find(
            (u) => u.role === 'owner' && u.active !== false,
          );
          paudit('admin.view_as', id, 'Platform admin opened the business');
          Object.assign(U, {
            mode: 'tenant',
            impersonating: true,
            user: owner.id,
            recent: [],
            filter: 'open',
            kdsFull: false,
            menuTab: 'master',
            closeTab: 'store',
          });
          save();
          enterTenant();
        },
        'admin-back': () => {
          const id = U.tenant;
          closeModal();
          closePop();
          useTenant(null);
          Object.assign(U, {
            mode: 'admin',
            impersonating: false,
            user: null,
            store: null,
            adminScreen: 'detail',
            adminTenant: id,
            wiz: null,
          });
          render();
        },
        'biz-status': (el) => {
          U.biz.status = el.dataset.v;
          U.biz.page = 0;
          render();
        },
        'biz-page': (el) => {
          U.biz.page = Math.max(0, U.biz.page + +el.dataset.v);
          render();
        },
        'pl-feat': (el) => {
          const id = el.dataset.p,
            k = el.dataset.v;
          U.planDraft = U.planDraft || {};
          const cur = U.planDraft[id] || planById(id).features.slice();
          U.planDraft[id] = cur.includes(k)
            ? cur.filter((x) => x !== k)
            : [...cur, k];
          render();
        },
        'pl-save': (el) => {
          const id = el.dataset.v;
          const r = run(() =>
            PL.savePlan(id, {
              name: val(`pl-name-${id}`),
              pricePerMonth: val(`pl-price-${id}`),
              includedBranches: val(`pl-inc-${id}`),
              pricePerExtraBranch: val(`pl-extra-${id}`),
              maxBranches: val(`pl-maxb-${id}`).trim(),
              maxUsers: val(`pl-maxu-${id}`).trim(),
              features:
                (U.planDraft && U.planDraft[id]) || planById(id).features,
            }),
          );
          if (r.ok) {
            if (U.planDraft) delete U.planDraft[id];
            render();
            toast(t('{p} saved.', { p: planById(id).name }));
          }
        },
      });
      Object.assign(CH, {
        'login-biz': (el) => {
          U.loginTenant = el.value;
          U.loginUser = null;
          render();
        },
        'as-group': (el) => {
          U.as.group = el.value;
          U.as.page = 0;
          render();
        },
        'biz-plan': (el) => {
          U.biz.plan = el.value;
          U.biz.page = 0;
          render();
        },
        'logo-file': (el) => {
          const f = el.files && el.files[0];
          if (!f) return;
          if (!/^image\//.test(f.type))
            return toast(t('Choose an image file.'), 'bad');
          if (f.size > 300 * 1024)
            return toast(t('The logo must be under 300 KB.'), 'bad');
          const rd = new FileReader();
          rd.onload = () => {
            U.logoDraft = rd.result;
            render();
          };
          rd.readAsDataURL(f);
        },
      });
      Object.assign(IN, {
        'sw-q': (el) => {
          const l = $('#sw-list');
          if (l) l.innerHTML = storeMenuList(el.value);
        },
        'as-q': (el) => {
          U.as.q = el.value;
          U.as.page = 0;
          render();
        },
        'br-q': (el) => {
          U.branchQ = el.value;
          render();
        },
        'biz-q': (el) => {
          U.biz.q = el.value;
          U.biz.page = 0;
          render();
        },
      });

      /* =============================================================
   Events and start-up
   ============================================================= */
      document.addEventListener('click', (e) => {
        if (
          !e.target.closest('#pop-root') &&
          !e.target.closest('[data-act="store-menu"]')
        )
          closePop();
        const el = e.target.closest('[data-act]');
        if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true')
          return;
        if (el.dataset.act === 'scrim' && e.target !== el) return;
        const fn = A[el.dataset.act];
        if (fn) {
          try {
            fn(el, e);
          } catch (err) {
            console.error(err);
            toast(err.message, 'bad', 'Something went wrong');
          }
        }
      });
      document.addEventListener('input', (e) => {
        const n = e.target.dataset && e.target.dataset.in;
        if (n && IN[n]) IN[n](e.target);
      });
      document.addEventListener('change', (e) => {
        const n = e.target.dataset && e.target.dataset.ch;
        if (n && CH[n]) CH[n](e.target);
      });
      document.addEventListener('keydown', (e) => {
        const typing =
          e.target.matches && e.target.matches('input, select, textarea');
        if (e.key === 'Escape') {
          if ($('#pop-root').innerHTML) return closePop();
          if (M) return closeModal();
          if (U.kdsFull) {
            U.kdsFull = false;
            render();
          }
          return;
        }
        if (e.key === '/' && !typing && !M) {
          const s =
            $('#item-q') || $('#board-q') || $('#menu-q') || $('#cust-q');
          if (s) {
            e.preventDefault();
            s.focus();
          }
          return;
        }
        if (U.screen === 'login' && U.loginUser && !typing && !M) {
          if (/^\d$/.test(e.key)) {
            e.preventDefault();
            pinDigit(e.key);
          } else if (e.key === 'Backspace') {
            e.preventDefault();
            A['pin-del']();
          }
        }
        if (
          e.key === 'Enter' &&
          M &&
          typing &&
          e.target.tagName === 'INPUT' &&
          !e.target.dataset.in
        ) {
          const b = $(
            '#modal-root .modal-foot .btn-primary, #modal-root .modal-foot .btn-danger',
          );
          if (b && !b.disabled) {
            e.preventDefault();
            b.click();
          }
        }
        if (
          e.key === 'Enter' &&
          !typing &&
          e.target.matches &&
          e.target.matches('tr[data-act]')
        ) {
          e.preventDefault();
          e.target.click();
        }
      });
      setInterval(() => {
        const c = $('#clock');
        if (c) c.textContent = fmtTime(Date.now());
        if (
          !M &&
          ['orders', 'dashboard', 'allstores'].includes(U.screen) &&
          !(
            document.activeElement &&
            document.activeElement.matches('input, select, textarea')
          )
        )
          render();
      }, 20000);
      window.addEventListener('storage', (e) => {
        if (e.key === LS_KEY && e.newValue) {
          const d = load();
          if (d) {
            DB = d;
            useTenant(U.tenant && DB.data[U.tenant] ? U.tenant : null);
            if (U.mode === 'tenant' && !D) A.lock();
            else render();
          }
        }
      });
      DB = load();
      if (!DB) {
        buildAll();
        save();
      }
      render();
    </script>
  </body>
</html>
